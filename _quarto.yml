project:
  type: website
  output-dir: docs
  resources:
    - images/brixplor_logmintext.svg

website:
  title: "brixplor.ing" #site's name. duh
  description: "Economics data platform with interactive visualizations" #an appropriate description
  site-url: https://brixplor.ing #well I hope I purchased the right domain
  favicon: images/brickb.svg #tab icon
  image: images/socialcard.jpg #preview image
  image-alt: "brixplor.ing logo and preview"
